name: 🐛 Bug report
description: Report something that isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 7, Android 14
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. v1.0.0
